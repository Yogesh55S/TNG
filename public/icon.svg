<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="icon-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stopColor="#123B70" />
      <stop offset="0.6" stopColor="#1E549A" />
      <stop offset="1" stopColor="#2F80ED" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="16" y1="48" x2="52" y2="16" gradientUnits="userSpaceOnUse">
      <stop stopColor="#2F80ED" />
      <stop offset="1" stopColor="#37C99A" />
    </linearGradient>
  </defs>
  <!-- Rounded squircle icon container -->
  <rect width="64" height="64" rx="16" fill="url(#icon-grad)" />
  
  <!-- Curved flight swoosh -->
  <path d="M 14 46 C 26 42, 38 28, 50 16" stroke="url(#accent-grad)" stroke-width="4" stroke-linecap="round" fill="none" />
  
  <!-- Airplane in flight -->
  <g transform="translate(50, 16) rotate(-22) scale(0.7)">
    <path d="M 12 0 L -6 -8 L -2 -2 L -12 -3 L -14 0 L -2 2 L -6 8 Z" fill="#FFFFFF" />
  </g>
  
  <!-- TNG Monogram -->
  <text x="32" y="44" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="1">
    TNG
  </text>
</svg>
